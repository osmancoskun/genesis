# Host try: default via eno1, Discord* via CloudflareWARP.
# Prefer dry-run first. Live+browser needs sudo + Mode B resolved (see host-try.sh).
# Does not disconnect WARP/Tailscale.
version: 1
defaults:
  dns: 1.1.1.1
  interface: auto
  pin_connections: true
  on_iface_down: fail_closed

# Optional: steer non-pinned IPv4 via a chosen NIC (owned table 18990).
# Do NOT enable this while Cloudflare WARP is connected: our catch-all priority
# (5100) sits above WARP (~5209) and breaks the WARP tunnel.
# Prefer HOST_LIVE without HOST_DEFAULT_PATH when testing with WARP.
# default_path:
#   interface: eno1
#   on_iface_down: fail_closed

rules:
  - name: discord-via-warp
    match:
      domains:
        - discord.com
        - "*.discord.com"
        - discord.app
        - "*.discord.app"
        - discord.gg
        - "*.discord.gg"
        - discordapp.com
        - "*.discordapp.com"
        - discordapp.net
        - "*.discordapp.net"
        - discord.media
        - "*.discord.media"
    dns: 1.1.1.1
    interface: CloudflareWARP
    pin_connections: true
