# Split-path demo: LAN + WARP-like nets entirely inside Docker (no host netns).
# Run: make demo-docker-split
name: genesis-split

services:
  dns-lan:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./coredns-lan:/etc/coredns:ro
    networks:
      lan:
        ipv4_address: 172.30.0.11

  dns-warp:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./coredns-warp:/etc/coredns:ro
    networks:
      warp:
        ipv4_address: 172.30.1.11

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - dns-lan
      - dns-warp
    volumes:
      - ./rules.template.yaml:/etc/genesis/rules.template.yaml:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      lan:
        ipv4_address: 172.30.0.20
      warp:
        ipv4_address: 172.30.1.20

  verify:
    image: alpine:3.20
    depends_on:
      - agent
      - dns-lan
      - dns-warp
    volumes:
      - ./.build/verifycheck:/verifycheck:ro
    entrypoint: ["/verifycheck"]
    networks:
      lan:
        ipv4_address: 172.30.0.30
      warp:
        ipv4_address: 172.30.1.30

networks:
  lan:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  warp:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.1.0/24
