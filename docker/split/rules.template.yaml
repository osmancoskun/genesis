# Docker-only split-path demo (does NOT touch host routing / WARP / Tailscale).
# Simulates: LAN default path + "WARP-like" path for blocked domains (discord.test).
# Placeholders __LAN_IF__ / __WARP_IF__ are rewritten by entrypoint from container IPs.
version: 1
defaults:
  dns: 172.30.0.11
  interface: auto
  pin_connections: false
  on_iface_down: fail_closed

default_path:
  interface: __LAN_IF__
  on_iface_down: fail_closed

rules:
  - name: discord-via-warp
    match:
      domains:
        - discord.test
        - "*.discord.test"
    dns: 172.30.1.11
    interface: __WARP_IF__
    pin_connections: true

  - name: lan-example
    match:
      domains:
        - example.test
        - "*.example.test"
    dns: 172.30.0.11
    interface: __LAN_IF__
    pin_connections: false
