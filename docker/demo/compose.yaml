# Genesis DNS steering demo: two upstream DNS + agent + dig checks.
# Run: docker compose -f docker/demo/compose.yaml up --build --abort-on-container-exit
name: genesis-demo

services:
  dns-alpha:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./coredns-alpha:/etc/coredns:ro
    networks:
      pathdemo:
        ipv4_address: 172.28.0.11

  dns-beta:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./coredns-beta:/etc/coredns:ro
    networks:
      pathdemo:
        ipv4_address: 172.28.0.12

  agent:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      - dns-alpha
      - dns-beta
    networks:
      pathdemo:
        ipv4_address: 172.28.0.20

  verify:
    image: alpine:3.20
    depends_on:
      - agent
      - dns-alpha
      - dns-beta
    volumes:
      - ./verify.sh:/verify.sh:ro
    entrypoint: ["/bin/sh", "/verify.sh"]
    networks:
      pathdemo:
        ipv4_address: 172.28.0.30

networks:
  pathdemo:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
