# Tag push → build Fedora RPM + publish GitHub Release assets and GHCR package.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version from tag
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build RPM (Fedora)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e VERSION="${{ steps.ver.outputs.version }}" \
            -e VERSION_MODE=tag \
            -e GOPROXY=https://proxy.golang.org,direct \
            fedora:44 \
            bash -lc './scripts/ci-package-rpm.sh'
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: List RPM artifacts
        id: artifacts
        run: |
          set -euo pipefail
          mapfile -t rpms < <(find dist/rpm/RPMS dist/rpm/SRPMS -type f -name '*.rpm' | sort)
          if [[ "${#rpms[@]}" -eq 0 ]]; then
            echo "no RPM artifacts found" >&2
            exit 1
          fi
          printf 'RPMs:\n'
          printf '  %s\n' "${rpms[@]}"
          {
            echo "files<<EOF"
            printf '%s\n' "${rpms[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.artifacts.outputs.files }}
          fail_on_unmatched_files: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container package
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent/Dockerfile
          push: true
          tags: |
            ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.tag }}
            ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}
            ${{ steps.ver.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Push RPM to GHCR (OCI package)
        run: |
          set -euo pipefail
          # Binary package (not SRPM) as an OCI artifact under Packages.
          rpm="$(find dist/rpm/RPMS -type f -name 'genesis-*.rpm' ! -name '*.src.rpm' | head -1)"
          test -n "$rpm"
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.2/oras_1.2.2_linux_amd64.tar.gz \
            | tar -xz oras
          ./oras push "${{ steps.ver.outputs.image }}-rpm:${{ steps.ver.outputs.version }}" \
            --artifact-type application/vnd.genesis.rpm.v1 \
            "${rpm}:application/x-rpm"
          ./oras push "${{ steps.ver.outputs.image }}-rpm:${{ steps.ver.outputs.tag }}" \
            --artifact-type application/vnd.genesis.rpm.v1 \
            "${rpm}:application/x-rpm"
